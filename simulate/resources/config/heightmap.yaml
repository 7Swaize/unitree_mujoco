# Total grid length in X direction
grid_extent_x: 5

# Total grid width in Y direction
grid_extent_y: 5

# Number of rays cast per unit length
rays_per_unit: 4

# Name of the MJCF <site> the sensor is mounted at (must exist in the
# loaded model; resolved via mj_name2id).
site_name: "Heightmap Site"
 
# Name of the MJCF <body> to exclude from ray hits. Required for the same
# reason as site_name.
exclude_body: "base_link"
